<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>이동 중... — FestivalHub</title>
  <!-- 예전 방식(detail.html?id=123)으로 들어온 방문자를
       새 정적 페이지(festival/123.html)로 자동으로 보내주는 안내판.
       상세 페이지 본체는 build-pages.js가 생성하는 festival/ 폴더에 있다. -->
  <script>
    const id = new URLSearchParams(location.search).get("id");
    location.replace(id ? `festival/${id}.html` : "index.html");
  </script>
</head>
<body>
  <p>페이지를 이동하고 있습니다... <a href="index.html">목록으로 가기</a></p>
</body>
</html>
