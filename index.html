<body>
  <header class="site-header">
    <h1>🎪 FestivalHub</h1>
    <p class="subtitle">오늘부터 3개월 안에 열리는 전국 축제</p>
  </header>

  <!-- 검색창 + 지역 필터 + 정렬. 실제 동작은 app.js가 담당 -->
  <section class="controls">
    <input type="search" id="search-input" placeholder="축제명 검색..." />
    <select id="region-filter">
      <option value="">전체 지역</option>
      <!-- 지역 목록은 app.js가 데이터를 보고 자동으로 채움 -->
    </select>
    <select id="sort-order">
      <option value="date">날짜순</option>
      <option value="name">이름순</option>
    </select>
    <!-- 체크박스 두 개는 한 묶음으로 — 모바일에서 흩어지지 않고 함께 줄바꿈됨 -->
    <div class="toggle-group">
      <!-- 90일 이상 이어지는 상설 공연/행사를 목록에서 뺄지 선택.
           data-tip 속성의 글이 마우스를 올리면 말풍선으로 표시됨 (style.css 참고) -->
      <label class="toggle" data-tip="기간이 90일 이상인 상설 공연·전시(수문장 교대의식, 상설 드론쇼 등)를 목록에서 가립니다. 체크를 끄면 다시 보여요.">
        <input type="checkbox" id="hide-long" checked />
        상설·장기 행사 숨기기
      </label>
      <!-- 하트 누른 축제만 모아보기 -->
      <label class="toggle" data-tip="카드의 하트(🤍)를 눌러 찜해둔 축제만 모아 봅니다. 찜 목록은 지금 쓰는 브라우저에만 저장됩니다.">
        <input type="checkbox" id="only-fav" />
        ❤️ 찜한 축제만
      </label>
      <!-- 내 주변 버튼: 위치 허용 시 가까운 축제 순으로 정렬 (동작은 app.js) -->
      <button type="button" id="near-me" class="near-me"
         data-tip="위치 사용을 허용하면 지금 계신 곳에서 가까운 축제 순으로 보여드려요. 위치는 어디에도 저장되지 않습니다.">📍 내 주변 가까운 순</button>
    </div>
  </section>

  <!-- 주말/지역 큐레이션 페이지 바로가기. 지역 칩은 app.js가 데이터를 보고 채움.
       sticky-desktop: 데스크톱에서 스크롤해도 상단 고정 -->
  <nav id="quick-links" class="quick-links sticky-desktop">
    <a class="chip chip-hot" href="weekend.html" data-tip="이번 주 토·일에 열리는 축제만 모아 보여줍니다. 매일 새벽 자동 갱신돼요.">🔥 이번 주말 축제</a>
  </nav>

  <!-- 방문자 사진 제보 안내 띠 (버튼을 누르면 report.js 안내창이 뜸) -->
  <div class="photo-call">
    <span class="photo-call-icon">📷</span>
    <div class="photo-call-text">
      <span class="photo-call-title">축제 사진 자랑해 주세요!</span>
      가족·친구와 찍은 축제 사진, 자랑하고 싶은 현장 사진을 보내주세요! <strong>닉네임과 함께</strong> 축제 페이지에 올려드려요.
    </div>
    <a class="photo-call-btn report-link" href="mailto:chayangho0323@gmail.com?subject=%5B%EC%82%AC%EC%A7%84%20%EC%A0%9C%EB%B3%B4%5D%20FestivalHub&amp;body=%EC%9E%A5%EC%86%8C(%ED%96%89%EC%82%AC)%20%EC%9D%B4%EB%A6%84%3A%20%0A%EC%A7%80%EC%97%AD%3A%20%0A%EB%B0%A9%EB%AC%B8%EC%9D%BC%3A%20%0A%ED%91%9C%EA%B8%B0%ED%95%A0%20%EB%8B%89%EB%84%A4%EC%9E%84%3A%20%0A%EC%82%AC%EC%A7%84%20%ED%95%9C%20%EC%A4%84%20%EC%84%A4%EB%AA%85(%EC%84%A0%ED%83%9D)%3A%20%0A%E2%80%BB%20%EC%A7%81%EC%A0%91%20%EC%B4%AC%EC%98%81%ED%95%9C%20%EC%82%AC%EC%A7%84%201~5%EC%9E%A5%EC%9D%84%20%EC%B2%A8%EB%B6%80%ED%95%B4%20%EC%A3%BC%EC%84%B8%EC%9A%94.%20%EB%B3%B4%EB%82%B4%EC%A3%BC%EC%8B%A0%20%EC%82%AC%EC%A7%84%EC%9D%80%20FestivalHub%EC%97%90%20%EB%8B%89%EB%84%A4%EC%9E%84%EA%B3%BC%20%ED%95%A8%EA%BB%98%20%EA%B2%8C%EC%8B%9C%EB%90%98%EB%8A%94%20%EB%8D%B0%20%EB%8F%99%EC%9D%98%ED%95%9C%20%EA%B2%83%EC%9C%BC%EB%A1%9C%20%EB%B4%85%EB%8B%88%EB%8B%A4.%0A%E2%80%BB%20%EC%82%AC%EC%A7%84%20%EC%86%8D%20%EC%9D%B8%EB%AC%BC%20%EB%AA%A8%EB%91%90%EA%B0%80%20%EA%B2%8C%EC%8B%9C%EC%97%90%20%EB%8F%99%EC%9D%98%ED%95%9C%20%EC%82%AC%EC%A7%84%EB%A7%8C%20%EB%B3%B4%EB%82%B4%EC%A3%BC%EC%84%B8%EC%9A%94.%20%EC%9A%94%EC%B2%AD%ED%95%98%EC%8B%9C%EB%A9%B4%20%EB%B0%94%EB%A1%9C%20%EB%82%B4%EB%A0%A4%EB%93%9C%EB%A6%BD%EB%8B%88%EB%8B%A4.">사진 보내기 →</a>
  </div>
