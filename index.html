<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FestivalHub — 전국 축제 모아보기 | 오늘부터 3개월 축제 일정</title>
  <!-- 검색 결과에 표시되는 사이트 설명 -->
  <meta name="description" content="전국에서 열리는 축제를 한눈에! 지역별 축제 일정, 위치, 사진, 주변 관광지·맛집 정보까지. 한국관광공사 공식 데이터 기반으로 매일 업데이트됩니다." />
  <link rel="canonical" href="https://festivalhub.kr/" />
  <!-- 네이버 서치어드바이저 소유권 확인용 태그 (지우면 안 됨) -->
  <meta name="naver-site-verification" content="9be9c864f1f5c2566e9e57db654844b98ce05890" />
  <!-- 카톡/SNS에 링크 공유했을 때 보이는 미리보기 정보 -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="FestivalHub — 전국 축제 모아보기" />
  <meta property="og:description" content="전국 축제 일정, 위치, 사진, 주변 관광지·맛집 정보를 한눈에!" />
  <meta property="og:url" content="https://festivalhub.kr/" />
  <link rel="stylesheet" href="style.css" />
  <!-- Google Analytics (방문자 통계) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-Q3T5H6HSQQ"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-Q3T5H6HSQQ');
  </script>
</head>
<body>
  <header class="site-header">
    <h1>🎪 FestivalHub</h1>
    <p class="subtitle">오늘부터 3개월 안에 열리는 전국 축제</p>
  </header>

  <!-- 검색창 + 지역 필터 + 정렬. 실제 동작은 app.js가 담당 -->
  <section class="controls">
    <input type="search" id="search-input" placeholder="축제명 검색..." />
    <select id="region-filter">
      <option value="">전체 지역</option>
      <!-- 지역 목록은 app.js가 데이터를 보고 자동으로 채움 -->
    </select>
    <select id="sort-order">
      <option value="date">날짜순</option>
      <option value="name">이름순</option>
    </select>
    <!-- 체크박스 두 개는 한 묶음으로 — 모바일에서 흩어지지 않고 함께 줄바꿈됨 -->
    <div class="toggle-group">
      <!-- 90일 이상 이어지는 상설 공연/행사를 목록에서 뺄지 선택.
           data-tip 속성의 글이 마우스를 올리면 말풍선으로 표시됨 (style.css 참고) -->
      <label class="toggle" data-tip="기간이 90일 이상인 상설 공연·전시(수문장 교대의식, 상설 드론쇼 등)를 목록에서 가립니다. 체크를 끄면 다시 보여요.">
        <input type="checkbox" id="hide-long" checked />
        상설·장기 행사 숨기기
      </label>
      <!-- 하트 누른 축제만 모아보기 -->
      <label class="toggle" data-tip="카드의 하트(🤍)를 눌러 찜해둔 축제만 모아 봅니다. 찜 목록은 지금 쓰는 브라우저에만 저장됩니다.">
        <input type="checkbox" id="only-fav" />
        ❤️ 찜한 축제만
      </label>
    </div>
  </section>

  <!-- 주말/지역 큐레이션 페이지 바로가기. 지역 칩은 app.js가 데이터를 보고 채움.
       sticky-desktop: 데스크톱에서 스크롤해도 상단 고정 -->
  <nav id="quick-links" class="quick-links sticky-desktop">
    <a class="chip chip-hot" href="weekend.html" data-tip="이번 주 토·일에 열리는 축제만 모아 보여줍니다. 매일 새벽 자동 갱신돼요.">🔥 이번 주말 축제</a>
  </nav>

  <!-- 현재 몇 건이 보이는지 표시 -->
  <p id="result-count" class="result-count"></p>

  <!-- 축제 카드들이 들어갈 자리. app.js가 채움 -->
  <main id="festival-list" class="festival-grid"></main>

  <!-- 우측 하단 맨 위로 버튼 -->
  <a class="to-top" href="#" aria-label="맨 위로">↑</a>

  <!-- 사이트 하단 공통 정보 (데이터 출처 표기는 공공데이터 이용 의무사항) -->
  <footer class="site-footer">
    <p>축제 정보 출처: 한국관광공사 TourAPI (공공데이터) · 매일 새벽 자동 갱신</p>
    <p><a href="about.html">사이트 소개</a> · <a href="weekend.html">이번 주말 축제</a></p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
